<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손익 대시보드</title>
<style>
  :root {
    --bg:#f4f6f9; --panel:#fff; --ink:#1c2430; --sub:#5b6675; --line:#dfe4ea;
    --accent:#2f6fdb; --accent2:#e58a1f; --neg:#c62f3d; --ok:#1f8a5b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; font-size:14px; line-height:1.5; }
  .wrap { max-width:1200px; margin:0 auto; padding:20px 16px 48px; }
  header.top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  h1 { font-size:22px; margin:0; }
  .subtitle { color:var(--sub); font-size:15px; margin-top:2px; }
  .meta { color:var(--sub); font-size:13px; margin-top:2px; }
  button, .btn { font:inherit; border:1px solid var(--accent); background:var(--accent); color:#fff; padding:8px 16px;
    border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .btn.ghost { background:#fff; color:var(--accent); }
  #drop { border:2px dashed #9db4d9; background:#fff; border-radius:10px; text-align:center; padding:40px 16px; color:var(--sub); margin-bottom:14px; }
  #drop.compact { padding:10px 16px; }
  #drop.compact .big { display:none; }
  #drop.over { background:#eaf1ff; border-color:var(--accent); }
  #drop .big { font-size:17px; color:var(--ink); margin-bottom:4px; }
  #drop input { display:none; }
  #msg { display:none; background:#fdecee; color:#8a1f2b; border:1px solid #f3b9bf; border-radius:8px; padding:10px 14px; margin-bottom:14px; white-space:pre-wrap; }
  .filters { display:flex; gap:14px; flex-wrap:wrap; align-items:center; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:10px 14px; margin-bottom:14px; }
  .filters label { color:var(--sub); font-size:13px; display:flex; gap:6px; align-items:center; }
  select { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; min-width:110px; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .card .k { color:var(--sub); font-size:13px; }
  .card .v { font-size:26px; font-weight:700; margin-top:2px; }
  .card .u { color:var(--sub); font-size:12px; }
  .neg { color:var(--neg); }
  section.box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  section.box h2 { font-size:16px; margin:0 0 10px; }
  section.box h2 small { color:var(--sub); font-weight:400; font-size:12px; margin-left:6px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; vertical-align:middle; }
  th { color:var(--sub); font-weight:600; font-size:12.5px; background:#f8fafc; }
  th:first-child, td:first-child { text-align:center; width:36px; }
  td.name, th.name { text-align:left; word-break:break-all; }
  td.bar { width:22%; }
  .bar i { display:block; height:10px; background:var(--accent); border-radius:2px; min-width:1px; }
  .stack { display:flex; height:26px; border-radius:5px; overflow:hidden; margin-bottom:10px; background:#eee; }
  .stack span { display:block; height:100%; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
  .callout { background:#fff7e8; border:1px solid #f1d6a1; border-radius:6px; padding:8px 12px; margin-bottom:10px; }
  .empty { color:var(--sub); padding:10px 0; }
  svg { width:100%; height:auto; display:block; }
  svg text { font-family:inherit; fill:#5b6675; font-size:11px; }
  .legend { color:var(--sub); font-size:12px; margin-bottom:4px; }
  .printhead { display:none; }
  #content { display:none; }
  @media (max-width:820px) { .cards { grid-template-columns:repeat(2,1fr); } .grid2 { grid-template-columns:1fr; } }
  @media print {
    @page { size:A4; margin:12mm; }
    body { background:#fff; font-size:11px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .wrap { max-width:none; padding:0; }
    #drop, .filters, #btnPrint, #msg, header.top button { display:none !important; }
    .printhead { display:block; margin-bottom:8px; }
    .card, section.box { break-inside:avoid; page-break-inside:avoid; }
    .grid2 { grid-template-columns:1fr 1fr; }
    .cards { grid-template-columns:repeat(4,1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>손익 대시보드</h1>
      <div class="subtitle">2026년 상반기 기준</div>
      <div class="meta" id="fileMeta">엑셀 파일을 올리면 이 브라우저 안에서만 읽습니다. 서버로 전송되거나 저장되지 않습니다.</div>
    </div>
    <button id="btnPrint" type="button" disabled>보고서 인쇄</button>
  </header>

  <label id="drop">
    <div class="big">여기에 엑셀 파일(.xlsx)을 끌어다 놓으세요</div>
    <div>또는 <u>클릭해서 파일 선택</u> · 시트 이름 "품목손익" · 3행이 머리글</div>
    <input id="file" type="file" accept=".xlsx,.xlsm,.xls">
  </label>
  <div id="msg" role="alert"></div>

  <div id="content">
    <div class="printhead" id="printHead"></div>
    <div class="filters">
      <label>연도 <select id="fYear"></select></label>
      <label>채널 <select id="fCh"></select></label>
      <label>대분류 <select id="fL1"></select></label>
      <span class="meta" id="rowCount"></span>
    </div>

    <div class="cards" id="cards"></div>

    <section class="box"><h2>월별 NNR 추이 <small>단위: 백만원</small></h2><div id="monthly"></div></section>

    <div class="grid2">
      <section class="box"><h2>채널별 구성 <small>NNR 기준</small></h2><div id="channels"></div></section>
      <section class="box"><h2>거래처 TOP 10 <small>NNR 기준, 단위: 백만원</small></h2><div id="customers"></div></section>
    </div>

    <section class="box"><h2>품목 TOP 10 <small>NNR 기준, 단위: 백만원</small></h2><div id="items"></div></section>
    <section class="box"><h2>MC%가 마이너스인 품목 <small>단위: 백만원</small></h2><div id="negItems"></div></section>
  </div>
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script>
(function () {
  'use strict';

  var SHEET = '품목손익';
  var HEADER_ROW_INDEX = 2; // 3행 (0부터 셈)
  var COLORS = ['#2f6fdb','#e58a1f','#1f8a5b','#8a5bd6','#c62f3d','#2aa3b8','#a3a33a','#777f8c'];

  // 화면 필드 -> 엑셀 머리글(공백 정리·소문자 비교)
  var FIELDS = {
    year:'연도', month:'월', ch:'채널', cust:'고객명', item:'품목명', l1:'대분류',
    gr:'gr', tta:'tta', nnr:'net net revenue', cogs:'variable cogs', dc:'variable dc', mc:'marginal contribution'
  };
  var REQUIRED = ['year','month','ch','cust','item','l1'];

  var allRows = [];
  var fileName = '';

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function normKey(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase(); }

  // ---------- 표시 형식 ----------
  function fmtM(v, d) {
    d = d || 0;
    var r = Number((v / 1e6).toFixed(d));
    if (r === 0) r = 0; // -0 방지
    return r.toLocaleString('ko-KR', { minimumFractionDigits:d, maximumFractionDigits:d });
  }
  function pct(v) { return (v == null || !isFinite(v)) ? '-' : (v * 100).toFixed(1) + '%'; }
  function ratio(a, b) { return b ? a / b : null; }

  // ---------- 값 정리 ----------
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : null;
    if (v == null) return null;
    var s = String(v).replace(/[,\s%]/g, '');
    if (s === '' || s === '-') return null;
    var n = Number(s);
    return isFinite(n) ? n : null;
  }
  function txt(v, fallback) {
    var s = v == null ? '' : String(v).trim(); // 앞뒤 공백(전각·NBSP 포함) 제거
    return s === '' ? fallback : s;
  }

  // ---------- 엑셀 읽기 ----------
  function showMsg(t) { var m = $('msg'); m.textContent = t || ''; m.style.display = t ? 'block' : 'none'; }

  function parseWorkbook(buf) {
    var wb = XLSX.read(buf, { type:'array' });
    var name = null;
    wb.SheetNames.forEach(function (n) { if (name === null && n.trim() === SHEET) name = n; });
    if (name === null) {
      throw new Error('"' + SHEET + '" 시트를 찾을 수 없습니다.\n이 파일의 시트: ' + wb.SheetNames.join(', '));
    }
    var aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, range:HEADER_ROW_INDEX, defval:null, raw:true });
    if (!aoa.length) throw new Error('3행 머리글 아래에 데이터가 없습니다.');

    var idx = {};
    aoa[0].forEach(function (h, i) {
      var k = normKey(h);
      Object.keys(FIELDS).forEach(function (f) { if (idx[f] === undefined && FIELDS[f] === k) idx[f] = i; });
    });
    var missing = REQUIRED.filter(function (f) { return idx[f] === undefined; }).map(function (f) { return FIELDS[f]; });
    if (idx.nnr === undefined && idx.gr === undefined) missing.push('Net Net Revenue 또는 GR');
    if (missing.length) {
      throw new Error('3행 머리글에서 다음 열을 찾지 못했습니다: ' + missing.join(', ') +
        '\n읽은 머리글: ' + aoa[0].filter(function (h) { return h != null; }).join(', '));
    }

    var get = function (r, f) { return idx[f] === undefined ? null : r[idx[f]]; };
    var rows = [];
    for (var i = 1; i < aoa.length; i++) {
      var r = aoa[i];
      var cust = txt(get(r, 'cust'), '');
      var item = txt(get(r, 'item'), '');
      var gr = num(get(r, 'gr')), tta = num(get(r, 'tta'));
      var nnr = num(get(r, 'nnr')), mc = num(get(r, 'mc'));
      if (cust === '' && item === '' && gr === null && nnr === null && mc === null) continue; // 완전한 빈 줄만 건너뜀 (수량 0 행은 유지)
      if (nnr === null) nnr = (gr || 0) - (tta || 0);
      if (mc === null) mc = nnr - (num(get(r, 'cogs')) || 0) - (num(get(r, 'dc')) || 0);
      var mm = parseInt(String(get(r, 'month') == null ? '' : get(r, 'month')).replace(/\D/g, ''), 10);
      rows.push({
        year: txt(get(r, 'year'), '(미지정)'),
        month: isNaN(mm) ? null : mm,
        ch: txt(get(r, 'ch'), '(미지정)'),
        l1: txt(get(r, 'l1'), '(미지정)'),
        cust: cust,
        item: item === '' ? '(품목명 없음)' : item,
        nnr: nnr, mc: mc
      });
    }
    if (!rows.length) throw new Error('읽을 수 있는 데이터 행이 없습니다.');
    return rows;
  }

  function loadBuffer(buf, name) {
    try {
      allRows = parseWorkbook(buf);
      fileName = name || '';
      showMsg('');
      buildFilters();
      $('drop').classList.add('compact');
      $('content').style.display = 'block';
      $('btnPrint').disabled = false;
      $('fileMeta').textContent = fileName + ' · ' + allRows.length.toLocaleString('ko-KR') + '행 (이 브라우저 안에서만 처리됨)';
      render();
    } catch (e) {
      showMsg(e.message || String(e));
    }
  }

  function loadFile(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () { loadBuffer(fr.result, file.name); };
    fr.onerror = function () { showMsg('파일을 읽지 못했습니다.'); };
    fr.readAsArrayBuffer(file);
  }

  // ---------- 필터 ----------
  function uniq(field) {
    var s = {};
    allRows.forEach(function (r) { s[r[field]] = 1; });
    return Object.keys(s).sort(function (a, b) { return a.localeCompare(b, 'ko', { numeric:true }); });
  }
  function fillSelect(id, values) {
    var sel = $(id);
    sel.innerHTML = '<option value="">전체</option>' +
      values.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('');
  }
  function buildFilters() {
    fillSelect('fYear', uniq('year'));
    fillSelect('fCh', uniq('ch'));
    fillSelect('fL1', uniq('l1'));
  }
  function filtered() {
    var y = $('fYear').value, c = $('fCh').value, l = $('fL1').value;
    return allRows.filter(function (r) {
      return (!y || r.year === y) && (!c || r.ch === c) && (!l || r.l1 === l);
    });
  }

  // ---------- 집계 ----------
  function group(rows, keyFn) {
    var m = {};
    rows.forEach(function (r) {
      var k = keyFn(r);
      if (k === null) return;
      var g = m[k] || (m[k] = { key:k, nnr:0, mc:0 });
      g.nnr += r.nnr; g.mc += r.mc;
    });
    return Object.keys(m).map(function (k) { return m[k]; });
  }
  function byNnrDesc(a, b) { return b.nnr - a.nnr; }

  // ---------- 그리기 ----------
  function render() {
    var rows = filtered();
    var y = $('fYear').value, c = $('fCh').value, l = $('fL1').value;
    $('rowCount').textContent = rows.length.toLocaleString('ko-KR') + '행 표시 중';
    $('printHead').innerHTML = '<strong>손익 보고서</strong> · ' + esc(fileName) +
      ' · 연도: ' + esc(y || '전체') + ' / 채널: ' + esc(c || '전체') + ' / 대분류: ' + esc(l || '전체') +
      ' · 출력일 ' + new Date().toLocaleDateString('ko-KR');

    if (!rows.length) {
      ['cards','monthly','channels','customers','items','negItems'].forEach(function (id) {
        $(id).innerHTML = '<div class="empty">조건에 맞는 데이터가 없습니다.</div>';
      });
      return;
    }

    var nnr = 0, mc = 0;
    rows.forEach(function (r) { nnr += r.nnr; mc += r.mc; });
    var custs = group(rows, function (r) { return r.cust === '' ? null : r.cust; });
    var mcp = ratio(mc, nnr);

    $('cards').innerHTML =
      card('총 NNR', fmtM(nnr), '백만원') +
      card('총 MC', fmtM(mc), '백만원', mc < 0) +
      card('MC%', pct(mcp), 'MC ÷ NNR', mcp != null && mcp < 0) +
      card('거래처 수', custs.length.toLocaleString('ko-KR'), '고객명 기준 (공백 제거 후 합산)');

    renderMonthly(rows);
    renderChannels(rows, nnr);
    renderCustomers(custs, nnr);
    renderItems(rows, nnr);
  }

  function card(k, v, u, neg) {
    return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v' + (neg ? ' neg' : '') + '">' +
      esc(v) + '</div><div class="u">' + esc(u) + '</div></div>';
  }

  function renderMonthly(rows) {
    var g = group(rows, function (r) {
      return r.year + '' + (r.month == null ? 99 : r.month);
    }).map(function (x) {
      var p = x.key.split('');
      x.year = p[0]; x.month = Number(p[1]);
      x.label = x.month === 99 ? p[0] + ' (월 없음)' : p[0] + '-' + (x.month < 10 ? '0' : '') + x.month;
      return x;
    }).sort(function (a, b) {
      return a.year.localeCompare(b.year, 'ko', { numeric:true }) || a.month - b.month;
    });

    var W = 900, H = 300, L = 64, R = 12, T = 16, B = 44;
    var vals = [0];
    g.forEach(function (x) { vals.push(x.nnr, x.mc); });
    var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    if (max === min) max = min + 1;
    var y = function (v) { return T + (max - v) / (max - min) * (H - T - B); };
    var slot = (W - L - R) / g.length, bw = Math.min(46, slot * 0.6);

    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="월별 NNR 추이">';
    for (var t = 0; t <= 4; t++) {
      var v = min + (max - min) * t / 4, yy = y(v);
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#e3e8ee"/>' +
           '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + esc(fmtM(v)) + '</text>';
    }
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#9aa5b4"/>';
    var step = Math.ceil(g.length / 18), pts = [];
    g.forEach(function (x, i) {
      var cx = L + slot * (i + 0.5), y0 = y(0), y1 = y(x.nnr);
      s += '<rect x="' + (cx - bw / 2) + '" y="' + Math.min(y0, y1) + '" width="' + bw + '" height="' + Math.max(1, Math.abs(y0 - y1)) +
           '" fill="' + (x.nnr < 0 ? '#c62f3d' : '#2f6fdb') + '"><title>' + esc(x.label) + ' NNR ' + esc(fmtM(x.nnr)) + ' / MC ' + esc(fmtM(x.mc)) + '</title></rect>';
      if (g.length <= 12) {
        s += '<text x="' + cx + '" y="' + (Math.min(y0, y1) - 4) + '" text-anchor="middle">' + esc(fmtM(x.nnr)) + '</text>';
      }
      if (i % step === 0) s += '<text x="' + cx + '" y="' + (H - B + 16) + '" text-anchor="middle">' + esc(x.label) + '</text>';
      pts.push(cx + ',' + y(x.mc));
    });
    s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#e58a1f" stroke-width="2"/>';
    pts.forEach(function (p) { var q = p.split(','); s += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="3" fill="#e58a1f"/>'; });
    s += '</svg>';
    $('monthly').innerHTML =
      '<div class="legend"><span class="dot" style="background:#2f6fdb"></span>NNR (막대) &nbsp; <span class="dot" style="background:#e58a1f"></span>MC (선)</div>' + s;
  }

  function renderChannels(rows, total) {
    var g = group(rows, function (r) { return r.ch; }).sort(byNnrDesc);
    var pos = g.reduce(function (a, x) { return a + Math.max(0, x.nnr); }, 0);
    var bar = '<div class="stack">' + g.map(function (x, i) {
      return pos > 0 && x.nnr > 0 ? '<span style="width:' + (x.nnr / pos * 100) + '%;background:' + COLORS[i % COLORS.length] + '" title="' + esc(x.key) + '"></span>' : '';
    }).join('') + '</div>';
    var tr = g.map(function (x, i) {
      return '<tr><td><span class="dot" style="background:' + COLORS[i % COLORS.length] + ';margin:0"></span></td>' +
        '<td class="name">' + esc(x.key) + '</td><td>' + esc(fmtM(x.nnr)) + '</td><td>' + esc(pct(ratio(x.nnr, total))) +
        '</td><td class="' + (x.mc < 0 ? 'neg' : '') + '">' + esc(pct(ratio(x.mc, x.nnr))) + '</td></tr>';
    }).join('');
    $('channels').innerHTML = bar + '<table><thead><tr><th></th><th class="name">채널</th><th>NNR</th><th>비중</th><th>MC%</th></tr></thead><tbody>' + tr + '</tbody></table>';
  }

  function renderCustomers(custs, total) {
    var top = custs.slice().sort(byNnrDesc).slice(0, 10);
    if (!top.length) { $('customers').innerHTML = '<div class="empty">거래처 정보가 없습니다.</div>'; return; }
    var first = top[0];
    var top10 = top.reduce(function (a, x) { return a + x.nnr; }, 0);
    var tr = top.map(function (x, i) {
      return '<tr><td>' + (i + 1) + '</td><td class="name">' + esc(x.key) + '</td><td>' + esc(fmtM(x.nnr)) + '</td><td>' + esc(pct(ratio(x.nnr, total))) + '</td></tr>';
    }).join('');
    $('customers').innerHTML =
      '<div class="callout">1위 거래처 <strong>' + esc(first.key) + '</strong> 비중 <strong>' + esc(pct(ratio(first.nnr, total))) +
      '</strong> (TOP 10 합계 ' + esc(pct(ratio(top10, total))) + ')</div>' +
      '<table><thead><tr><th>#</th><th class="name">거래처</th><th>NNR</th><th>비중</th></tr></thead><tbody>' + tr + '</tbody></table>';
  }

  function renderItems(rows, total) {
    var g = group(rows, function (r) { return r.item; });
    var top = g.slice().sort(byNnrDesc).slice(0, 10);
    var maxV = Math.max.apply(null, top.map(function (x) { return Math.max(0, x.nnr); }).concat([1]));
    var tr = top.map(function (x, i) {
      var p = ratio(x.mc, x.nnr);
      return '<tr><td>' + (i + 1) + '</td><td class="name">' + esc(x.key) + '</td>' +
        '<td class="bar"><i style="width:' + (Math.max(0, x.nnr) / maxV * 100) + '%"></i></td>' +
        '<td>' + esc(fmtM(x.nnr)) + '</td><td class="' + (x.mc < 0 ? 'neg' : '') + '">' + esc(fmtM(x.mc)) + '</td>' +
        '<td class="' + (p != null && p < 0 ? 'neg' : '') + '">' + esc(pct(p)) + '</td></tr>';
    }).join('');
    $('items').innerHTML = '<table><thead><tr><th>#</th><th class="name">품목</th><th></th><th>NNR</th><th>MC</th><th>MC%</th></tr></thead><tbody>' + tr + '</tbody></table>';

    // MC%가 마이너스: NNR>0 이면서 MC<0 (MC% 음수), 또는 NNR<=0 이면서 MC<0 (MC% 계산 불가지만 적자)
    var neg = g.filter(function (x) { return x.mc < 0; }).sort(function (a, b) { return a.mc - b.mc; });
    if (!neg.length) { $('negItems').innerHTML = '<div class="empty">없음</div>'; return; }
    $('negItems').innerHTML = '<table><thead><tr><th>#</th><th class="name">품목</th><th>NNR</th><th>MC</th><th>MC%</th></tr></thead><tbody>' +
      neg.map(function (x, i) {
        return '<tr><td>' + (i + 1) + '</td><td class="name">' + esc(x.key) + '</td><td>' + esc(fmtM(x.nnr, 1)) +
          '</td><td class="neg">' + esc(fmtM(x.mc, 1)) + '</td><td class="neg">' + esc(x.nnr > 0 ? pct(x.mc / x.nnr) : '-') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  // ---------- 이벤트 ----------
  ['fYear','fCh','fL1'].forEach(function (id) { $(id).addEventListener('change', render); });
  $('btnPrint').addEventListener('click', function () { window.print(); });
  $('file').addEventListener('change', function (e) { loadFile(e.target.files[0]); e.target.value = ''; });

  ['dragenter','dragover'].forEach(function (t) {
    window.addEventListener(t, function (e) { e.preventDefault(); $('drop').classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function (t) {
    window.addEventListener(t, function (e) { e.preventDefault(); $('drop').classList.remove('over'); });
  });
  window.addEventListener('drop', function (e) { loadFile(e.dataTransfer && e.dataTransfer.files[0]); });

  window.loadBuffer = loadBuffer; // 자체 점검용

  if (typeof XLSX === 'undefined') showMsg('vendor/xlsx.full.min.js 를 불러오지 못했습니다. vendor 폴더가 index.html 옆에 있는지 확인하세요.');
})();
</script>
</body>
</html>
